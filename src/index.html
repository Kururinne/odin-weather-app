<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div class="todays-weather-card">
    <div class="location">Los Angeles</div>
    <div class="main-info">
      <div class="conditions-icon">
        <svg width="100" height="100" viewBox="0 0 100 100"> 
          <circle cx="50" cy="50" r="50" fill="orange" />
        </svg>
      </div>
      <div class="temp-info">
        <div class="temp-number">83</div>
        <div class="units-switch">
          <div class="celsius-button">°F</div>
          <div class="fahrenheit-button">°C</div>
        </div>
      </div>
      <div class="misc-info">
        <div class="precip">Precipitation: 0%</div>
        <div class="humidity">Humidity: 60%</div>
        <div class="wind">Wind: 8 mph</div>
      </div>
    </div>
  </div>
</body>
</html>
