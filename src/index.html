<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div id="content">
    <form id="search-form">
      <label for="search-input">Search for a city</label>
      <input type="text" id="search-input" name="search-input" placeholder="City" value="Los Angeles">
      <button type="submit">Search</button>
    </form>
    <div class="error-display"></div>
    <div id="weather-info">
    </div>
  </div>
</body>
</html>

<template id="weather-card-template">
  <div class="todays-weather-card">
    <div class="loc-time">
      <div class="location">Los Angeles</div>
      <div class="time-tz">8:10</div>
    </div>
    <div class="description">Cloudy with a chance of meatballs</div>
    <div class="main-info">
      <div class="conditions-icon">
        <svg width="100" height="100" viewBox="0 0 100 100"> 
          <circle cx="50" cy="50" r="50" fill="orange" />
        </svg>
      </div>
      <div class="temp-info">
        <div class="temp-number">83</div>
        <div class="units-switch">
          <div class="us">°F</div>  
          <div class="metric">°C</div>
        </div>
      </div>
      <div class="misc-info">
        <div class="precip">Precipitation: 0%</div>
        <div class="humidity">Humidity: 60%</div>
        <div class="wind">Wind: 8 mph</div>
      </div>
    </div>
    <div class="other-units">
      <div class="time-tz">8:10</div>
      <div class="temp-number">28</div>
      <div class="wind">12.9</div>
    </div>
  </div>
</template>
